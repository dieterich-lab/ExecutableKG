[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-vectorrag-comparison"
version = "0.1.0"
description = "Reproducible row-level VectorRAG baseline for clinical recommendation-table experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.scripts]
vectorrag = "vectorrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

